<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#84cc16">Хранитель</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий C, высокий D, низкий A</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_guard" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#84cc16"/>
          <stop offset="100%" stop-color="#4d7c0f"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 70 Q85 50 125 72" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 64 L128 73 L118 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="110" font-family="Caveat, cursive" font-size="20" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">надёжность</tspan>
        <tspan x="16" dy="23">и правила —</tspan>
        <tspan x="16" dy="23">защищают</tspan>
        <tspan x="16" dy="23">результат ☺</tspan>
      </text>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="265" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Stick feet -->
      <path d="M190 205 L190 226 L180 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M225 205 L225 226 L235 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 65 C245 60 262 105 258 155 C254 195 235 210 205 208 C175 206 156 195 152 155 C148 105 165 68 205 65 Z" fill="url(#g_guard)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Round Glasses -->
      <g stroke="#ffffff" stroke-width="2" fill="none" filter="url(#wob)">
        <circle cx="192" cy="116" r="11"/>
        <circle cx="220" cy="116" r="11"/>
        <line x1="203" y1="116" x2="209" y2="116" stroke-width="2.5"/>
      </g>
      <circle cx="192" cy="116" r="3" fill="#ffffff"/>
      <circle cx="220" cy="116" r="3" fill="#ffffff"/>
      <path d="M200 134 Q206 140 212 134" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Shield held on right -->
      <g transform="translate(215, 138) scale(0.95)">
        <path d="M15 0 C30 0 35 15 35 30 C35 50 15 65 15 65 C15 65 -5 50 -5 30 C-5 15 0 0 15 0 Z" fill="#166534" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
        <path d="M5 28 L12 36 L26 18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Padlock on right -->
      <g transform="translate(258, 50)">
        <rect x="0" y="10" width="20" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8" filter="url(#wob)"/>
        <path d="M4 10 L4 5 C4 0 16 0 16 5 L16 10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="10" cy="17" r="2" fill="#ffffff"/>
      </g>
      <!-- Sparkle -->
      <path d="M288 135 Q292 127 296 135 Q304 139 296 143 Q292 151 288 143 Q280 139 288 135 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">надёжно. безопасно. правильно. ♡</text>
  </g>
</svg>