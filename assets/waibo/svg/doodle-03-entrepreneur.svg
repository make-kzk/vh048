<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#f97316">Предприниматель</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий A, низкий C, низкий D</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_entr" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fb923c"/>
          <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 68 Q85 48 125 70" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 62 L128 71 L118 76" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="108" font-family="Caveat, cursive" font-size="20" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">вижу</tspan>
        <tspan x="16" dy="22">возможности</tspan>
        <tspan x="16" dy="22">там, где другие</tspan>
        <tspan x="16" dy="22">сомневаются ☺</tspan>
      </text>
      <!-- Mountain Rocks -->
      <path d="M235 226 L250 185 L285 226 Z" fill="#1e293b" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" filter="url(#wob)"/>
      <path d="M255 226 L275 195 L300 226 Z" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="240" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Stepping legs: left leg on ground, right leg stepping on rock! -->
      <path d="M188 198 L188 226 L178 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M226 195 L242 188 L250 188" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 60 C245 55 260 100 256 150 C252 190 232 205 202 202 C172 200 156 188 152 148 C148 100 165 65 205 60 Z" fill="url(#g_entr)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Face: Cool sunglasses -->
      <path d="M178 112 Q192 108 204 112 Q218 108 230 112 L228 124 Q216 130 206 122 Q194 130 180 124 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
      <line x1="184" y1="115" x2="198" y2="121" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="210" y1="115" x2="224" y2="121" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M198 136 Q205 142 212 136" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Arm holding flag pole -->
      <path d="M248 140 Q265 130 268 105" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#wob)"/>
      <!-- Flag on pole -->
      <g transform="translate(268, 55)">
        <line x1="0" y1="0" x2="0" y2="75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M0 5 L28 12 L0 25 Z" fill="#ffedd5" stroke="#ffffff" stroke-width="1.8" filter="url(#wob)"/>
      </g>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">риск. скорость. рост. ⚡</text>
  </g>
</svg>