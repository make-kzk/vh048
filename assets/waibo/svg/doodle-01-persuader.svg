<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#ff4d8d">Убеждающий</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий B, низкий D</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_pers" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff4d8d"/>
          <stop offset="100%" stop-color="#d81b60"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 75 Q85 55 125 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 70 L128 79 L118 84" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="118" font-family="Caveat, cursive" font-size="22" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">я вдохновляю</tspan>
        <tspan x="16" dy="26">людей</tspan>
        <tspan x="16" dy="26">и зажигаю</tspan>
        <tspan x="16" dy="26">идеи ☺</tspan>
      </text>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="265" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Little stick feet -->
      <path d="M190 205 L190 226 L180 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M225 205 L225 226 L235 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 65 C245 60 262 105 258 155 C254 195 235 210 205 208 C175 206 156 195 152 155 C148 105 165 68 205 65 Z" fill="url(#g_pers)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Face -->
      <circle cx="192" cy="118" r="3.5" fill="#ffffff"/>
      <circle cx="218" cy="118" r="3.5" fill="#ffffff"/>
      <path d="M198 132 Q205 140 212 132" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Arms: left on hip, right pointing up -->
      <path d="M154 145 Q140 155 148 172 Q156 172 158 165" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)"/>
      <path d="M256 142 Q272 130 268 110 L268 98" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#wob)"/>
      <!-- Hand pointing finger -->
      <path d="M265 98 L268 88 L271 98 Z" fill="#ffffff"/>
      <!-- Speech bubble with heart -->
      <g transform="translate(252, 38) scale(0.9)">
        <path d="M12 25 C0 22 -4 8 8 2 C20 -4 34 2 34 14 C34 22 26 28 20 28 L15 36 L14 28 Z" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
        <path d="M16 11 C13 7 7 11 15 18 C23 11 17 7 14 11 Z" fill="#ff4d8d" stroke="#ffffff" stroke-width="0.8"/>
      </g>
      <!-- Sparkle -->
      <path d="M290 170 Q294 162 298 170 Q306 174 298 178 Q294 186 290 178 Q282 174 290 170 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">слова. энергия. влияние. ☆</text>
  </g>
</svg>