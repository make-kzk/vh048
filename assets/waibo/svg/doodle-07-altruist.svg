<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#ec4899">Альтруист</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий B, высокий C, низкий A</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_altr" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fb7185"/>
          <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 75 Q85 55 125 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 70 L128 79 L118 84" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="118" font-family="Caveat, cursive" font-size="21" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">мне важно,</tspan>
        <tspan x="16" dy="25">чтобы людям</tspan>
        <tspan x="16" dy="25">было</tspan>
        <tspan x="16" dy="25">хорошо ☺</tspan>
      </text>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="265" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Stick feet -->
      <path d="M190 205 L190 226 L180 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M225 205 L225 226 L235 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 65 C245 60 262 105 258 155 C254 195 235 210 205 208 C175 206 156 195 152 155 C148 105 165 68 205 65 Z" fill="url(#g_altr)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Closed happy eyes (^_^) -->
      <path d="M186 118 Q192 110 198 118" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M212 118 Q218 110 224 118" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M200 128 Q205 134 210 128" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Big Heart hugged in hands -->
      <g transform="translate(182, 138) scale(1.05)">
        <path d="M22 14 C16 4 4 12 12 24 C20 34 22 36 22 36 C22 36 24 34 32 24 C40 12 28 4 22 14 Z" fill="#fff1f2" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
        <!-- arms hugging -->
        <path d="M0 18 Q10 26 16 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M44 18 Q34 26 28 26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- People network doodle top right -->
      <g transform="translate(252, 50) scale(0.85)">
        <circle cx="16" cy="6" r="5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="2" cy="20" r="4" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <circle cx="30" cy="20" r="4" fill="none" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="13" y1="10" x2="5" y2="16" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2,2"/>
        <line x1="19" y1="10" x2="27" y2="16" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="2,2"/>
      </g>
      <!-- Floating heart -->
      <path d="M280 120 C276 114 270 118 274 124 C278 129 280 130 280 130 C280 130 282 129 286 124 C290 118 284 114 280 120 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">забота. поддержка. доверие. ♡</text>
  </g>
</svg>