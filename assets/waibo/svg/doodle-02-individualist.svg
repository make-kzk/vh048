<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#a855f7">Индивидуалист</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий A, низкий D</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_indiv" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 75 Q85 55 125 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 70 L128 79 L118 84" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="118" font-family="Caveat, cursive" font-size="22" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">у меня</tspan>
        <tspan x="16" dy="26">свой путь</tspan>
        <tspan x="16" dy="26">и свои</tspan>
        <tspan x="16" dy="26">правила ☺</tspan>
      </text>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="265" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Little stick feet -->
      <path d="M190 205 L190 226 L180 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M225 205 L225 226 L235 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 75 C245 70 260 110 256 155 C252 195 235 210 205 208 C175 206 156 195 152 155 C148 110 165 78 205 75 Z" fill="url(#g_indiv)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Striped Beanie Hat -->
      <g filter="url(#wob)">
        <path d="M176 80 Q205 38 234 80 Z" fill="#4338ca" stroke="#ffffff" stroke-width="2"/>
        <rect x="172" y="75" width="66" height="14" rx="4" fill="#312e81" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Pom pom -->
        <circle cx="205" cy="38" r="6.5" fill="#ffffff"/>
        <!-- stripes -->
        <line x1="188" y1="52" x2="188" y2="75" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="205" y1="45" x2="205" y2="75" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="222" y1="52" x2="222" y2="75" stroke="#ffffff" stroke-width="1.5"/>
      </g>
      <!-- Face -->
      <circle cx="192" cy="122" r="3.5" fill="#ffffff"/>
      <circle cx="218" cy="122" r="3.5" fill="#ffffff"/>
      <path d="M200 135 Q208 142 216 135" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Arms crossed over chest -->
      <path d="M160 155 Q180 178 230 165" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#wob)"/>
      <path d="M250 155 Q230 178 180 168" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#wob)"/>
      <!-- Lightbulb top right -->
      <g transform="translate(255, 38) scale(0.9)">
        <circle cx="12" cy="12" r="10" fill="#fef08a" stroke="#ffffff" stroke-width="1.8" filter="url(#wob)"/>
        <line x1="8" y1="22" x2="16" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="-2" x2="12" y2="-6" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
        <line x1="2" y1="2" x2="-2" y2="-2" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="2" x2="26" y2="-2" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Doodle x -->
      <text x="285" y="180" font-family="Caveat, cursive" font-size="24" fill="#ffffff">✕</text>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">свобода. оригинальность. результат. ♡</text>
  </g>
</svg>