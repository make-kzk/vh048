<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 398 418" width="398" height="418" style="background: #121319; border-radius: 20px;">
  <defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>
  
  <!-- Header Title & Subtitle -->
  <g transform="translate(18, 24)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="32" font-weight="700" fill="#3b82f6">Исследователь</text>
    <text y="26" font-family="'Caveat', cursive, sans-serif" font-size="19" fill="#ffffff">Высокий D, низкий B</text>
  </g>
  
  <!-- Mascot SVG -->
  <g transform="translate(24, 75)">
    <svg viewBox="0 0 350 250" width="350" height="250" style="overflow: visible;">
      
      <defs>
        <linearGradient id="g_inv" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
      </defs>
      <!-- Dashed curved arrow -->
      <path d="M50 70 Q85 50 125 72" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,4" filter="url(#wob)"/>
      <path d="M120 64 L128 73 L118 78" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Left monologue text -->
      <text x="16" y="110" font-family="Caveat, cursive" font-size="20" fill="#ffffff" letter-spacing="0.3px">
        <tspan x="16" dy="0">знания —</tspan>
        <tspan x="16" dy="23">мой путь</tspan>
        <tspan x="16" dy="23">к глубине</tspan>
        <tspan x="16" dy="23">и истине ☺</tspan>
      </text>
      <!-- Ground line -->
      <line x1="160" y1="226" x2="265" y2="226" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3,3"/>
      <!-- Stick feet -->
      <path d="M190 205 L190 226 L180 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M225 205 L225 226 L235 226" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blob Mascot -->
      <g filter="url(#wob)">
        <path d="M205 65 C245 60 262 105 258 155 C254 195 235 210 205 208 C175 206 156 195 152 155 C148 105 165 68 205 65 Z" fill="url(#g_inv)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <!-- Round Glasses -->
      <g stroke="#ffffff" stroke-width="2" fill="none" filter="url(#wob)">
        <circle cx="192" cy="116" r="11"/>
        <circle cx="220" cy="116" r="11"/>
        <line x1="203" y1="116" x2="209" y2="116" stroke-width="2.5"/>
      </g>
      <circle cx="192" cy="116" r="3" fill="#ffffff"/>
      <circle cx="220" cy="116" r="3" fill="#ffffff"/>
      <path d="M200 134 Q206 140 212 134" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Open Book held in hands -->
      <g transform="translate(182, 142) scale(0.95)">
        <path d="M24 8 Q12 0 0 4 L0 32 Q12 28 24 36 Q36 28 48 32 L48 4 Q36 0 24 8 Z" fill="#0f172a" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
        <line x1="24" y1="8" x2="24" y2="36" stroke="#ffffff" stroke-width="2"/>
        <line x1="5" y1="12" x2="19" y2="10" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="5" y1="18" x2="19" y2="16" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="5" y1="24" x2="19" y2="22" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="29" y1="10" x2="43" y2="12" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="29" y1="16" x2="43" y2="18" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="29" y1="22" x2="43" y2="24" stroke="#94a3b8" stroke-width="1.2"/>
      </g>
      <!-- Magnifying Glass top right -->
      <g transform="translate(255, 48)">
        <circle cx="12" cy="12" r="10" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#wob)"/>
        <line x1="20" y1="20" x2="32" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Stack of books on right -->
      <g transform="translate(258, 142) scale(0.85)">
        <rect x="0" y="0" width="32" height="9" rx="2" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
        <rect x="3" y="11" width="32" height="9" rx="2" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
        <rect x="0" y="22" width="35" height="9" rx="2" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
      </g>
    
    </svg>
  </g>
  
  <!-- Bottom Rhythm Words -->
  <g transform="translate(18, 385)">
    <text font-family="'Caveat', cursive, sans-serif" font-size="21" fill="rgba(255,255,255,0.85)">изучаю. анализирую. понимаю. ✧</text>
  </g>
</svg>